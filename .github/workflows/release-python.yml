name: Release Python

# tag 时发布：
#   1. 各平台 caddocling 二进制 → GitHub Release（docling-go-cad 运行时按 CADCLI_BIN/PATH/内置路径引用）
#   2. docling-go-cad Python 包 → PyPI（需要仓库 secret PYPI_API_TOKEN；未配置时仅产出 artifact）
on:
  push:
    tags: ['v*']

jobs:
  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, ext: '' }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, ext: '' }
          - { os: macos-latest, goos: darwin, goarch: amd64, ext: '' }
          - { os: macos-latest, goos: darwin, goarch: arm64, ext: '' }
          - { os: windows-latest, goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags '-s -w' -o caddocling${{ matrix.ext }} ./cmd/caddocling
      - name: package
        shell: bash
        run: |
          name="caddocling-${{ matrix.goos }}-${{ matrix.goarch }}"
          tar czf "${name}.tar.gz" caddocling${{ matrix.ext }} || zip "${name}.zip" caddocling${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: caddocling-${{ matrix.goos }}-${{ matrix.goarch }}
          path: caddocling-*.tar.gz
          if-no-files-found: error

  pypi:
    runs-on: ubuntu-latest
    needs: binaries
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build sdist and wheel
        run: |
          pip install build
          python -m build integrations/docling-go-cad
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: integrations/docling-go-cad/dist/*
          if-no-files-found: error
      # 未配置 PYPI_API_TOKEN 时跳过上传，artifact 仍可手动发布
      - name: publish to pypi
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/docling-go-cad/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  gh-release:
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
